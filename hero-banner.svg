<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Bahattin Yunus Çetin — Systems Architect &amp; Deep-Tech Researcher">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A101F" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1.0" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111A2E" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>

    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>

    <style>
      .eyebrow { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38BDF8; letter-spacing: 3.5px; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-size: 46px; font-weight: 800; fill: url(#nameGrad); letter-spacing: 3px; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #E2E8F0; letter-spacing: 1.5px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #94A3B8; letter-spacing: 0.3px; }
      .card-num { font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.4px; }
      .card-sub { font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; fill: #94A3B8; }
      .meta { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #64748B; letter-spacing: 1px; }
      .meta-hi { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #CBD5E1; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Canvas & Architectural Grid -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="url(#archGrid)" />
  <ellipse cx="600" cy="145" rx="540" ry="190" fill="url(#ambientGlow)" />

  <!-- Subtle Geometric Orbital Arcs (Iconic Background Motif) -->
  <path d="M 180 420 A 460 460 0 0 1 1020 420" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" opacity="0.7" />
  <path d="M 80 420 A 560 560 0 0 1 1120 420" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.5" />

  <!-- Top Minimal Header Bar -->
  <g transform="translate(56, 36)">
    <circle cx="6" cy="6" r="3.5" fill="#38BDF8" />
    <text x="20" y="10" class="meta-hi">ANKARA, TÜRKİYE</text>
    <text x="155" y="10" class="meta">•</text>
    <text x="172" y="10" class="meta">METU (ODTÜ) &amp; HACETTEPE</text>
    <text x="1088" y="10" text-anchor="end" class="meta">PORTFOLIO // <tspan fill="#38BDF8">BAHATTINYUNUS.GITHUB.IO</tspan></text>
  </g>
  <line x1="56" y1="58" x2="1144" y2="58" stroke="#1E293B" stroke-width="1" />

  <!-- Centerpiece Identity -->
  <g transform="translate(600, 102)">
    <text x="0" y="0" text-anchor="middle" class="eyebrow">SYSTEMS ARCHITECTURE • DEEP TECH • RESEARCH</text>
    <text x="0" y="54" text-anchor="middle" class="name">BAHATTİN YUNUS ÇETİN</text>
    <rect x="-220" y="74" width="440" height="1.5" fill="url(#accentLine)" />
    <text x="0" y="104" text-anchor="middle" class="role">Software &amp; Systems Architect  •  Autonomous Robotics, Edge AI &amp; Aerospace</text>
    <text x="0" y="130" text-anchor="middle" class="desc">Engineering high-reliability software from bare-metal silicon and real-time control to orbital flight systems.</text>
  </g>

  <!-- Four Iconic Architectural Pillars -->
  <g transform="translate(56, 268)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="257" height="88" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
      <line x1="18" y1="0" x2="88" y2="0" stroke="#38BDF8" stroke-width="2" />
      <text x="20" y="26" class="card-num">01 // AUTONOMY</text>
      <text x="20" y="48" class="card-title">Robotics &amp; Control</text>
      <text x="20" y="68" class="card-sub">ROS 2 • EKF SLAM • MPC</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(277, 0)">
      <rect x="0" y="0" width="257" height="88" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
      <line x1="18" y1="0" x2="88" y2="0" stroke="#818CF8" stroke-width="2" />
      <text x="20" y="26" class="card-num" fill="#818CF8">02 // INTELLIGENCE</text>
      <text x="20" y="48" class="card-title">Edge AI &amp; Foundation</text>
      <text x="20" y="68" class="card-sub">PyTorch • QLoRA • Vision</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(554, 0)">
      <rect x="0" y="0" width="257" height="88" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
      <line x1="18" y1="0" x2="88" y2="0" stroke="#2DD4BF" stroke-width="2" />
      <text x="20" y="26" class="card-num" fill="#2DD4BF">03 // AEROSPACE</text>
      <text x="20" y="48" class="card-title">Avionics &amp; Orbital SW</text>
      <text x="20" y="68" class="card-sub">NASA-cFS • CubeSat • DSP</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(831, 0)">
      <rect x="0" y="0" width="257" height="88" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
      <line x1="18" y1="0" x2="88" y2="0" stroke="#F59E0B" stroke-width="2" />
      <text x="20" y="26" class="card-num" fill="#F59E0B">04 // INFRASTRUCTURE</text>
      <text x="20" y="48" class="card-title">Silicon &amp; Cyber Systems</text>
      <text x="20" y="68" class="card-sub">RISC-V • C++20 • Security</text>
    </g>
  </g>

  <!-- Bottom Executive Footer -->
  <line x1="56" y1="378" x2="1144" y2="378" stroke="#1E293B" stroke-width="1" />
  <g transform="translate(56, 398)">
    <text x="0" y="0" class="meta">75+ OPEN-SOURCE REPOSITORIES   •   200+ TECHNICAL ARTICLES   •   270+ VERIFIED CREDENTIALS</text>
    <text x="1088" y="0" text-anchor="end" class="meta-hi">PRECISION • ARCHITECTURE • IMPACT</text>
  </g>
</svg>
