<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Flagship Repositories Telemetry">
  <defs>
    <style>
      .card { fill: #07121B; stroke: #1A3547; stroke-width: 1.5; }
      .repo-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #00d4ff; }
      .badge { font-family: 'Fira Code', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #2DD4BF; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #94A3B8; }
      .meta { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #CBD5E1; }
    </style>
  </defs>

  <!-- Card 1: AstroBio-Edge-Architecture -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="408" height="114" rx="10" class="card" />
    <text x="20" y="28" class="repo-title">🚀 AstroBio-Edge-Architecture</text>
    <rect x="322" y="14" width="72" height="18" rx="4" fill="#0B2938" stroke="#00d4ff" stroke-width="0.8" />
    <text x="358" y="26" text-anchor="middle" class="badge">ACTIVE</text>
    <text x="20" y="52" class="desc">Deep-space biosignal intelligence &amp; distributed swarm</text>
    <text x="20" y="68" class="desc">edge inference for autonomous spectroscopy.</text>
    <circle cx="24" cy="94" r="5" fill="#3572A5" />
    <text x="36" y="98" class="meta">Python • Swarm AI • Edge Computing • PyTorch</text>
  </g>

  <!-- Card 2: Ay-Otonom-Navigasyon -->
  <g transform="translate(430, 0)">
    <rect x="2" y="2" width="408" height="114" rx="10" class="card" />
    <text x="20" y="28" class="repo-title">🌕 Ay-Otonom-Navigasyon</text>
    <rect x="322" y="14" width="72" height="18" rx="4" fill="#0B2938" stroke="#2DD4BF" stroke-width="0.8" />
    <text x="358" y="26" text-anchor="middle" class="badge">NOMINAL</text>
    <text x="20" y="52" class="desc">GPS-denied lunar surface autonomous rover navigation,</text>
    <text x="20" y="68" class="desc">multi-sensor EKF fusion, SLAM &amp; DWA/A* path planning.</text>
    <circle cx="24" cy="94" r="5" fill="#f34b7d" />
    <text x="36" y="98" class="meta">ROS 2 • C++ • Extended Kalman Filter • Nav2</text>
  </g>

  <!-- Card 3: TerraSense-CubeSat-Architecture -->
  <g transform="translate(0, 132)">
    <rect x="2" y="2" width="408" height="114" rx="10" class="card" />
    <text x="20" y="28" class="repo-title">🛰️ TerraSense-CubeSat-Architecture</text>
    <rect x="322" y="14" width="72" height="18" rx="4" fill="#0B2938" stroke="#38BDF8" stroke-width="0.8" />
    <text x="358" y="26" text-anchor="middle" class="badge">FLIGHT-SW</text>
    <text x="20" y="52" class="desc">Feza-X Aethel-Class CubeSat flight software architecture,</text>
    <text x="20" y="68" class="desc">fault-tolerant avionics bus &amp; orbital payload telemetry.</text>
    <circle cx="24" cy="94" r="5" fill="#f34b7d" />
    <text x="36" y="98" class="meta">C++ • NASA-cFS • Avionics • Orbital Telemetry</text>
  </g>

  <!-- Card 4: formula_student_autonomous_stack -->
  <g transform="translate(430, 132)">
    <rect x="2" y="2" width="408" height="114" rx="10" class="card" />
    <text x="20" y="28" class="repo-title">🏎️ formula_student_autonomous_stack</text>
    <rect x="322" y="14" width="72" height="18" rx="4" fill="#0B2938" stroke="#00e676" stroke-width="0.8" />
    <text x="358" y="26" text-anchor="middle" class="badge">REAL-TIME</text>
    <text x="20" y="52" class="desc">High-speed autonomous racing stack featuring YOLOv8</text>
    <text x="20" y="68" class="desc">cone perception, Delaunay track mapping &amp; MPC control.</text>
    <circle cx="24" cy="94" r="5" fill="#f34b7d" />
    <text x="36" y="98" class="meta">ROS 2 • C++20 • YOLOv8 • Model Predictive Control</text>
  </g>
</svg>
