<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Bahattin Yunus Çetin — ODTÜ (METU) AI &amp; Autonomous Systems</title>
  <desc id="desc">Official portfolio hero banner for Bahattin Yunus Çetin featuring Middle East Technical University (ODTÜ / METU) logo and autonomous systems focus.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B11" />
      <stop offset="50%" stop-color="#071422" />
      <stop offset="100%" stop-color="#001833" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A3547" />
      <stop offset="35%" stop-color="#00d4ff" />
      <stop offset="65%" stop-color="#CF0A2C" />
      <stop offset="100%" stop-color="#1A3547" />
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2F5FF" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>

    <!-- ODTÜ Red Glow -->
    <radialGradient id="odtuGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF0A2C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#CF0A2C" stop-opacity="0.0" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Sci-Fi Grid -->
    <pattern id="sciGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0f2b3f" stroke-width="0.8" opacity="0.38" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: Consolas, 'SF Mono', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .odtu-text { fill: #CF0A2C; font-weight: 800; letter-spacing: 2px; }
    .tag-rect { fill: #081B2A; stroke: #1A3E58; stroke-width: 1; rx: 4; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#bgGrad)" stroke="#162D3D" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#sciGrid)" />

  <!-- Animated Neon Border Accent -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.85" />

  <!-- Corner Tech Accent Decals -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#00d4ff" stroke-width="2" />
  <path d="M 1184 35 L 1184 16 L 1165 16" fill="none" stroke="#00d4ff" stroke-width="2" />
  <path d="M 16 285 L 16 304 L 35 304" fill="none" stroke="#00d4ff" stroke-width="2" />
  <path d="M 1184 285 L 1184 304 L 1165 304" fill="none" stroke="#00d4ff" stroke-width="2" />

  <!-- Top System Telemetry Label -->
  <text x="50" y="44" class="mono" font-size="11" fill="#7193A6" letter-spacing="2">COMMAND CENTER // METU CEIT ARCHITECTURAL NODE</text>
  <circle cx="1115" cy="40" r="4.5" fill="#00e676" filter="url(#cyanGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="1102" y="44" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#00e676" letter-spacing="1.5">ONLINE // 2026 INITIATIVES</text>

  <!-- Horizontal Divider -->
  <line x1="50" y1="58" x2="1150" y2="58" stroke="#163349" stroke-width="1" />

  <!-- ==================== LEFT: ODTÜ / METU EMBLEM & IDENTITY ==================== -->
  <g transform="translate(65, 82)">
    <!-- Aura behind ODTÜ logo -->
    <circle cx="68" cy="65" r="75" fill="url(#odtuGlow)" />

    <!-- Official ODTÜ / METU Crest SVG -->
    <g transform="translate(10, 8) scale(2.0)">
      <path fill="#CF0A2C" transform="translate(0, -7)" d="M33.7,8c-1.5,0-3.1,0.2-4.5,0.4c-1.5-0.3-3-0.4-4.5-0.4C12.3,8,2.3,18.1,2.3,30.5S12.4,53,24.8,53c1.5,0,3-0.2,4.5-0.5c1.5,0.3,3,0.5,4.5,0.5c12.3,0,22.4-10.1,22.4-22.5C56.1,18.1,46.1,8,33.7,8
      M11.2,30.5c0-10.9,7.7-19.9,18-22v44C18.9,50.4,11.2,41.3,11.2,30.5
      M33.7,52.3c-1,0-2-0.1-2.9-0.2c9.4-2.7,16.4-11.3,16.4-21.6s-6.9-19-16.4-21.6c1-0.1,2-0.2,2.9-0.2c12,0,21.7,9.8,21.7,21.8C55.5,42.5,45.7,52.3,33.7,52.3"/>
    </g>

    <!-- University Typography -->
    <text x="68" y="132" text-anchor="middle" class="sans odtu-text" font-size="16">ODTÜ • METU</text>
    <text x="68" y="150" text-anchor="middle" class="mono" font-size="9" fill="#8EA7B5" letter-spacing="1.2">EST. 1956 • ANKARA</text>
  </g>

  <!-- Vertical Divider with animated scanning beam -->
  <line x1="225" y1="80" x2="225" y2="250" stroke="#1B3A4F" stroke-width="1.2" stroke-dasharray="6,4" />
  <circle cx="225" cy="80" r="2.5" fill="#00d4ff">
    <animate attributeName="cy" values="80;250;80" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== RIGHT: BAHATTIN YUNUS ÇETİN & DOMAIN STACK ==================== -->
  <g transform="translate(255, 78)">
    <!-- Sub-badge -->
    <rect x="0" y="4" width="235" height="22" rx="4" fill="#001F3F" stroke="#00d4ff" stroke-width="1" />
    <text x="10" y="19" class="mono" font-size="10.5" font-weight="700" fill="#00d4ff" letter-spacing="1.5">AI &amp; AUTONOMOUS SYSTEMS</text>

    <!-- Primary Name -->
    <text x="0" y="65" class="sans" font-size="38" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">BAHATTİN YUNUS ÇETİN</text>

    <!-- Bio / Role tagline -->
    <text x="0" y="98" class="sans" font-size="15" font-weight="500" fill="#CBD5E1">
      <tspan fill="#00d4ff" font-weight="700">ODTÜ / METU CEIT</tspan> &#160;•&#160; Autonomous Robotics &amp; Edge-AI Systems Architect
    </text>
    <text x="0" y="120" class="mono" font-size="12" fill="#7E9AA9">
      Turning complex robotics, deep-space telemetry, and ROS2 stacks into mission-critical hardware-software reality.
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: ROS2 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="105" height="24" class="tag-rect" />
        <circle cx="12" cy="12" r="3.5" fill="#22314E" />
        <text x="24" y="16" class="mono" font-size="11" font-weight="600" fill="#38BDF8">ROS2 HUMBLE</text>
      </g>
      <!-- Pill 2: C++20 -->
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="70" height="24" class="tag-rect" />
        <text x="12" y="16" class="mono" font-size="11" font-weight="600" fill="#00d4ff">C++20</text>
      </g>
      <!-- Pill 3: Edge-AI -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="85" height="24" class="tag-rect" />
        <text x="12" y="16" class="mono" font-size="11" font-weight="600" fill="#2DD4BF">EDGE-AI</text>
      </g>
      <!-- Pill 4: Embedded -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="135" height="24" class="tag-rect" />
        <text x="12" y="16" class="mono" font-size="11" font-weight="600" fill="#FBBF24">EMBEDDED SYSTEMS</text>
      </g>
      <!-- Pill 5: Aerospace -->
      <g transform="translate(435, 0)">
        <rect x="0" y="0" width="150" height="24" class="tag-rect" />
        <text x="12" y="16" class="mono" font-size="11" font-weight="600" fill="#F43F5E">DEFENSE &amp; AVIONICS</text>
      </g>
      <!-- Pill 6: ODTÜ Red Pill -->
      <g transform="translate(595, 0)">
        <rect x="0" y="0" width="125" height="24" rx="4" fill="#1C050B" stroke="#CF0A2C" stroke-width="1" />
        <text x="12" y="16" class="mono" font-size="11" font-weight="700" fill="#FF4D6D">ODTÜ CEIT '28</text>
      </g>
    </g>
  </g>

  <!-- Bottom Data Line -->
  <path d="M 50 286 L 1150 286" fill="none" stroke="#163349" stroke-width="1" stroke-dasharray="16,8" />
  <text x="50" y="303" class="mono" font-size="9.5" fill="#5A798C">LATENCY: REAL-TIME &lt;1ms // DDS PROTOCOL: NOMINAL // SPACE &amp; GROUND TELEMETRY ACTIVE</text>
  <text x="1150" y="303" text-anchor="end" class="mono" font-size="9.5" fill="#5A798C">EPISTEMIC TECHNOLOGY PHILOSOPHY © 2026</text>
</svg>
